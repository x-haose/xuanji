// WE wallpaperPropertyListener
window.wallpaperPropertyListener = {
    applyGeneralProperties: function(props) {
        if (props.fps !== undefined) {
            if (props.fps > 0) {
                // 时钟每60帧才需刷新一次（秒针每秒移动一次，高频更新无意义且浪费CPU）
                _clockInterval = Math.max(1000, Math.round(1000 / Math.min(props.fps, 60)));
                if (updateTimer) { clearInterval(updateTimer); updateTimer = null; }
                updateTimer = setInterval(updateClockDisplay, _clockInterval);
            } else if (props.fps === 0) {
                if (updateTimer) { clearInterval(updateTimer); updateTimer = null; }
                if (fullUpdateTimer) { clearInterval(fullUpdateTimer); fullUpdateTimer = null; }
            }
        }
    },
    applyUserProperties: function(properties) {
        var needReapply = false;
        var needReinit = false;

        if (properties.bgtype && properties.bgtype.value) {
            currentBgType = properties.bgtype.value;
            needReapply = true;
        }

        // 粒子风格切换
        if (properties.particlestyle && properties.particlestyle.value) {
            particleConfig.style = properties.particlestyle.value;
            // 雷法粒子需要 lightning canvas，其他风格隐藏
            var lc = document.getElementById('lightning-canvas');
            if (lc && currentBgType === 'particles') {
                lc.style.display = (particleConfig.style === 'thunder') ? '' : 'none';
            }
            needReinit = true;
        }
        // 粒子配色模式
        if (properties.particlecolormode && properties.particlecolormode.value) {
            particleColorMode = properties.particlecolormode.value;
            needReinit = true;
        }
        // 粒子颜色
        if (properties.particlecolor && properties.particlecolor.value) {
            var cArr = properties.particlecolor.value.split(' ');
            var r = Math.ceil(parseFloat(cArr[0]) * 255);
            var g = Math.ceil(parseFloat(cArr[1]) * 255);
            var b = Math.ceil(parseFloat(cArr[2]) * 255);
            particleColorHex = '#' + [r, g, b].map(function(v) { return v.toString(16).padStart(2, '0'); }).join('');
            if (particleColorMode === 'solid') { needReinit = true; }
        }
        // 粒子可调参数 — 直接取值（slider min/max 已约束范围）
        if (properties.particlecount !== undefined) { particleConfig.count = properties.particlecount.value; needReinit = true; }
        if (properties.particlespeed !== undefined) { particleConfig.speed = properties.particlespeed.value; needReinit = true; }
        if (properties.particlesize !== undefined) { particleConfig.size = properties.particlesize.value; needReinit = true; }
        if (properties.particleopacity !== undefined) { particleConfig.opacity = properties.particleopacity.value / 10; needReinit = true; }
        if (properties.lineenable !== undefined) { particleConfig.lineEnable = properties.lineenable.value; needReinit = true; }
        if (properties.linedistance !== undefined) { particleConfig.lineDistance = properties.linedistance.value; needReinit = true; }
        if (properties.lineopacity !== undefined) { particleConfig.lineOpacity = properties.lineopacity.value / 10; needReinit = true; }
        if (properties.movedirection && properties.movedirection.value) { particleConfig.direction = properties.movedirection.value; needReinit = true; }

        // 渐变参数
        if (properties.gradientcolor1 && properties.gradientcolor1.value) {
            var c = properties.gradientcolor1.value.split(' ');
            gradientColors[0] = 'rgb(' + c.map(function(v) { return Math.ceil(v * 255); }).join(',') + ')';
            if (currentBgType === 'gradient') { needReapply = true; }
        }
        if (properties.gradientcolor2 && properties.gradientcolor2.value) {
            var c = properties.gradientcolor2.value.split(' ');
            gradientColors[1] = 'rgb(' + c.map(function(v) { return Math.ceil(v * 255); }).join(',') + ')';
            if (currentBgType === 'gradient') { needReapply = true; }
        }
        if (properties.gradientcolor3 && properties.gradientcolor3.value) {
            var c = properties.gradientcolor3.value.split(' ');
            gradientColors[2] = 'rgb(' + c.map(function(v) { return Math.ceil(v * 255); }).join(',') + ')';
            if (currentBgType === 'gradient') { needReapply = true; }
        }
        if (properties.gradientangle !== undefined) { gradientAngle = properties.gradientangle.value; if (currentBgType === 'gradient') { needReapply = true; } }
        if (properties.gradienttype && properties.gradienttype.value) { gradientType = properties.gradienttype.value; if (currentBgType === 'gradient') { needReapply = true; } }
        if (properties.gradientspeed !== undefined) {
            gradientSpeed = properties.gradientspeed.value;
            if (currentBgType === 'gradient') { needReapply = true; }
        }

        // 纯色
        if (properties.bgcolor && properties.bgcolor.value) {
            var rgb = properties.bgcolor.value.split(' ');
            bgSolidColor = 'rgb(' + rgb.map(function(v) { return Math.ceil(v * 255); }).join(', ') + ')';
            if (currentBgType === 'color') { needReapply = true; }
        }
        // 图片
        if (properties.bgimage && properties.bgimage.value) {
            bgImagePath = properties.bgimage.value;
            if (currentBgType === 'image') { needReapply = true; }
        }
        // 视频
        if (properties.videofile && properties.videofile.value) {
            bgVideoPath = properties.videofile.value;
            if (currentBgType === 'video') { needReapply = true; }
        }
        // 轮播间隔
        if (properties.slideshowinterval !== undefined) {
            bgSlideInterval = properties.slideshowinterval.value;
            if (bgSlideFiles.length > 1 && currentBgType === 'slideshow') { startSlideshow(); }
        }
        // 音频律动
        if (properties.audioreactive !== undefined) {
            audioReactive = properties.audioreactive.value;
            if (!audioReactive || currentBgType !== 'particles') { audioModTimerActive = false; stopAudioMod(); }
            else { audioModTimerActive = true; startAudioMod(); }
        }
        if (properties.audiosensitivity !== undefined) {
            audioSensitivity = properties.audiosensitivity.value / 5;
        }
        if (properties.audiobass !== undefined) {
            audioBass = properties.audiobass.value / 5;
        }
        if (properties.audiotreble !== undefined) {
            audioTreble = properties.audiotreble.value / 5;
        }
        // 暗色主题
        if (properties.darktheme !== undefined) {
            var dark = properties.darktheme.value;
            var body = document.body;
            if (dark && body.classList.contains('animated-background-light')) {
                body.classList.remove('animated-background-light'); body.classList.add('animated-background-dark');
            } else if (!dark && body.classList.contains('animated-background-dark')) {
                body.classList.remove('animated-background-dark'); body.classList.add('animated-background-light');
            }
            updateTime();
        }
        // 液态玻璃参数
        if (properties.glassopacity !== undefined) { glassSettings.opacity = properties.glassopacity.value; applyGlassSettings(); }
        if (properties.glassblur !== undefined) { glassSettings.blur = properties.glassblur.value; applyGlassSettings(); }
        if (properties.glasssaturation !== undefined) { glassSettings.saturate = properties.glasssaturation.value; applyGlassSettings(); }
        if (properties.glassborder !== undefined) { glassSettings.border = properties.glassborder.value; applyGlassSettings(); }

        // 标题显示/隐藏
        if (properties.showtitle !== undefined) {
            var titleEl = document.getElementById('dao-title');
            if (titleEl) { titleEl.style.display = properties.showtitle.value ? '' : 'none'; }
        }

        // 个人日干切换
        if (properties.userRiGan && properties.userRiGan.value) {
            window.userRiGan = properties.userRiGan.value;
            updateScorePanel();
        }


        if (needReinit) {
            ensureParticlesInit();  // 确保粒子已初始化
            applyParticleParamsToInstance();  // 立即更新参数（不等 debounce）
            reinitParticles();  // 异步完整重建（处理风格切换等）
        }
        if (needReapply) { applyCustomBackground(); }
    },
    setPaused: function(paused) {
        if (paused) {
            // 停止渐变动画
            stopGradAnimation();
            // 停止时钟定时器
            if (updateTimer) { clearInterval(updateTimer); updateTimer = null; }
            if (fullUpdateTimer) { clearInterval(fullUpdateTimer); fullUpdateTimer = null; }
            // 停止音频调制定时器
            stopAudioMod();
            // 移除 particlesJS 内部 resize 监听器（防泄漏）
            if (_particlesResizeFn) {
                window.removeEventListener('resize', _particlesResizeFn);
                _particlesResizeFn = null;
            }
            // 移除其他 resize 监听器（fixPos / resizeLightning）
            if (_resizeActive) {
                for (var ri = 0; ri < _resizeHandlers.length; ri++) {
                    window.removeEventListener('resize', _resizeHandlers[ri].debounced);
                }
                _resizeActive = false;
            }
            // 停止粒子渲染循环 — 清空 pJSDom 并移除 canvas
            if (window.pJSDom && window.pJSDom.length > 0) {
                for (var i = 0; i < window.pJSDom.length; i++) {
                    try { if (window.pJSDom[i].pJS && window.pJSDom[i].pJS.fn) window.pJSDom[i].pJS.fn.canvas.clear(); } catch(e) {}
                }
                window.pJSDom = [];
            }
            var particlesEl = document.getElementById('particles-js');
            if (particlesEl) { while (particlesEl.firstChild) { particlesEl.removeChild(particlesEl.firstChild); } }
            // 暂停 CSS 动画 + JS 发光
            var animated = document.querySelectorAll('.floating');
            for (var a = 0; a < animated.length; a++) { animated[a].style.animationPlayState = 'paused'; }
            _stopGlow();
            // 清零音频频谱（防止恢复时使用残留数据）
            audioSpectrum = new Array(128).fill(0);
            audioEnabled = false;
            // 释放视频解码资源
            if (bgVideoEl) { bgVideoEl.pause(); bgVideoEl.removeAttribute('src'); try { bgVideoEl.load(); } catch(e) {} bgVideoEl.style.display = 'none'; }
            // 清空轮播定时器
            stopSlideshow();
        } else {
            // 恢复 CSS 动画 + JS 发光
            var animated = document.querySelectorAll('.floating');
            _startGlow();
            for (var a = 0; a < animated.length; a++) { animated[a].style.animationPlayState = ''; }
            // 恢复 resize 监听器
            if (!_resizeActive) {
                for (var ri = 0; ri < _resizeHandlers.length; ri++) {
                    window.addEventListener('resize', _resizeHandlers[ri].debounced);
                }
                _resizeActive = true;
            }
            // 恢复渐变背景
            if (currentBgType === 'gradient') applyCustomBackground();
            // 恢复时钟定时器（使用保存的 FPS 间隔，而非硬编码 1000）
            if (!updateTimer) { updateTimer = setInterval(updateClockDisplay, _clockInterval); updateClockDisplay(); }
            if (!fullUpdateTimer) { fullUpdateTimer = setInterval(function() { updateTime(); updateHuangLi(); updateScorePanel(); }, 10000); updateTime(); updateHuangLi(); updateScorePanel(); }
            // 恢复音频调制（仅在粒子+音频律动开启时恢复）
            if (currentBgType === 'particles' && audioReactive) { audioModTimerActive = true; startAudioMod(); }
            // 恢复粒子渲染：取消 applyUserProperties 可能触发的异步重建，避免双重初始化
            clearTimeout(reinitTimer);
            reinitTimer = null;
            if (currentBgType === 'particles') { _doReinitParticles(); }
        }
    },
    userDirectoryFilesAddedOrChanged: function(propertyName, changedFiles) {
        if (propertyName === 'bgdir') { onDirectoryFilesChanged(changedFiles); }
    },
    userDirectoryFilesRemoved: function(propertyName, removedFiles) {
        if (propertyName === 'bgdir') {
            var removedSet = {};
            for (var i = 0; i < removedFiles.length; i++) { removedSet[removedFiles[i]] = true; }
            bgSlideFiles = bgSlideFiles.filter(function(f) { return !removedSet[f]; });
            bgSlideIndex = Math.min(bgSlideIndex, bgSlideFiles.length - 1);
            if (bgSlideFiles.length === 0) { stopSlideshow(); }
        }
    }
};

// ══════════════════════════════════════════════
// 音频可视化 — 监听 + 粒子直接修改
// ══════════════════════════════════════════════
// 监听器按需注册：一旦注册，WE 将持续进行 FFT 计算（约 30fps），无法撤销。
// 因此延迟到用户首次启用「粒子+音频律动」时才注册，纯色/渐变等背景完全避开。
var _audioListenerRegistered = false;
function ensureAudioListener() {
    if (_audioListenerRegistered) return;
    if (typeof window.wallpaperRegisterAudioListener !== 'function') return;
    _audioListenerRegistered = true;
    window.wallpaperRegisterAudioListener(function(audioArray) {
        for (var i = 0; i < 128; i++) {
            audioSpectrum[i] = audioArray[i];
        }
        audioEnabled = true;
    });
}

// ══════════════════════════════════════════════
// 雷祖圣号发光动画 — JS驱动 ~10fps（替代 CSS 60fps，降 6 倍帧率）
// ══════════════════════════════════════════════
var _glowPhase = 0;
var _glowTimer = null;
var _glowActive = true;
var _glowEl = null;
function _glowStep() {
    if (!_glowActive) { _glowTimer = null; return; }
    if (!_glowEl) _glowEl = document.querySelector('#dao-title h1');
    if (_glowEl) {
        _glowPhase += 0.06;
        var t = (Math.sin(_glowPhase) + 1) / 2;
        _glowEl.style.textShadow = '0 0 ' + (5 + t * 13).toFixed(1) + 'px rgba(' + Math.round(255 - t * 40) + ',' + Math.round(215 - t * 146) + ',0,' + (0.3 + t * 0.2).toFixed(2) + ')';
    }
    _glowTimer = setTimeout(_glowStep, 100);
}
function _startGlow() { _glowActive = true; _glowStep(); }
function _stopGlow() { _glowActive = false; if (_glowTimer) { clearTimeout(_glowTimer); _glowTimer = null; } }
_startGlow();

// 递归分形闪电绘制
function drawLightningFractal(ctx, x1, y1, x2, y2, displace, thickness) {
    if (displace < thickness) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        return;
    }
    var midX = (x1 + x2) / 2 + (Math.random() - 0.5) * displace;
    var midY = (y1 + y2) / 2 + (Math.random() - 0.5) * displace;
    drawLightningFractal(ctx, x1, y1, midX, midY, displace / 2, thickness);
    drawLightningFractal(ctx, midX, midY, x2, y2, displace / 2, thickness);
    // 分支
    if (Math.random() < 0.35 && displace > 12) {
        var bx = midX + (Math.random() - 0.5) * displace * 0.6;
        var by = midY + displace * 0.4;
        drawLightningFractal(ctx, midX, midY, bx, Math.min(ctx.canvas.height, by), displace / 3, thickness * 0.5);
    }
}

// 音频调制定时器: 每 80ms 直接修改每个粒子的半径、透明度、速度，以及雷法闪电/RGB循环
var audioModTimer = null;
function audioModStep() {
    if (!audioEnabled || !audioReactive || !audioModTimerActive) return;
    try {
        // 快速能量检测：无音频时提前退出，避免遍历全部粒子
        var totalEnergy = 0;
        for (var ei = 0; ei < 128; ei++) totalEnergy += audioSpectrum[ei];
        if (totalEnergy < 0.001) return;

        var pdom = window.pJSDom;
        if (!pdom || pdom.length === 0) return;
        var p = pdom[pdom.length - 1].pJS;
        if (!p || !p.particles || !p.particles.array) return;

        // 频谱能量
        var bass = 0, treble = 0, mid = 0;
        for (var i = 0; i < 20; i++) bass += audioSpectrum[i];
        for (var j = 40; j < 80; j++) mid += audioSpectrum[j];
        for (var k = 80; k < 128; k++) treble += audioSpectrum[k];
        bass = bass / 20 * audioBass * audioSensitivity;
        mid = mid / 40 * audioSensitivity;
        treble = treble / 48 * audioTreble * audioSensitivity;

        var energy = (bass + mid + treble) / 3;

        var sizeMul = 1.0 + energy * 4.0;
        var distMul = 1.0 + bass * 2.5;
        var speedMul = 1.0 + bass * 6.0;

        // 线距
        p.particles.line_linked.distance = Math.max(15, particleConfig.lineDistance * distMul);

        // 逐个粒子
        var arr = p.particles.array;
        var style = particleConfig.style;
        var now = Date.now();

        // 雷法闪电逻辑：仅音频有能量时才触发
        if (style === 'thunder') {
            if (now >= thunderFlashTimer && energy > 0.05) {
                thunderFlashTimer = now + (Math.random() * 3000 + 2000);
                thunderFlashDuration = 250;
                // 绘制分形闪电
                var lc = document.getElementById('lightning-canvas');
                if (lc) {
                    var lctx = lc.getContext('2d');
                    lctx.clearRect(0, 0, lc.width, lc.height);
                    lc.style.opacity = '1';
                    lctx.strokeStyle = 'rgba(220,230,255,0.95)';
                    lctx.shadowBlur = 18;
                    lctx.shadowColor = 'rgba(180,200,255,0.9)';
                    lctx.lineCap = 'round';
                    var bolts = 2 + Math.floor(Math.random() * 3);
                    for (var bi = 0; bi < bolts; bi++) {
                        var sx = Math.random() * lc.width;
                        var ex = sx + (Math.random() - 0.5) * lc.width * 0.5;
                        drawLightningFractal(lctx, sx, 0, ex, lc.height, 100, 4);
                    }
                }
            }
            // 渐隐闪电画布
            var lc = document.getElementById('lightning-canvas');
            if (lc) {
                var op = parseFloat(lc.style.opacity) || 0;
                if (op > 0) {
                    lc.style.opacity = Math.max(0, op - 0.03);
                }
            }
        }

        for (var ii = 0; ii < arr.length; ii++) {
            var pt = arr[ii];
            if (pt._baseR === undefined) {
                pt._baseR = pt.radius;
                pt._baseO = (typeof pt.opacity === 'number') ? pt.opacity : 0.5;
                pt._baseVx = pt.vx;
                pt._baseVy = pt.vy;
                // 保存粒子原始 HSL（particles.js 的 color 是 {h,s,l} 对象）
                if (pt.color && typeof pt.color.h !== 'undefined') {
                    pt._baseH = pt.color.h;
                    pt._baseS = pt.color.s;
                    pt._baseL = pt.color.l;
                }
            }

            // 速度调制
            pt.vx = pt._baseVx * speedMul;
            pt.vy = pt._baseVy * speedMul;

            // RGB 循环: 按时间+粒子索引动态HSL（非雷法闪电时）
            var isRGB = (particleColorMode === 'rgbcycle');
            var isThunderFlash = (style === 'thunder' && thunderFlashDuration > 0);

            if (isThunderFlash) {
                var elapsed = now - (thunderFlashTimer - 250);
                var flashProgress = Math.max(0, 1 - elapsed / 250);
                if (pt.color && typeof pt.color.h !== 'undefined') {
                    pt.color.h = pt._baseH;
                    pt.color.s = Math.max(10, pt._baseS * (1.0 - flashProgress * 0.7));
                    pt.color.l = Math.min(90, pt._baseL + flashProgress * 40);
                }
                pt.radius = Math.max(0.3, pt._baseR * (1.0 + flashProgress * 2.0));
                if (typeof pt.opacity === 'number') {
                    pt.opacity = Math.min(1, pt._baseO * (1.0 + flashProgress * 1.5));
                }
            } else {
                // 正常模式：thunder固定尺寸，其他风格音频调制
                if (isRGB && pt.color && typeof pt.color.h !== 'undefined') {
                    pt.color.h = ((now * 0.05 + ii * 17) % 360);
                    pt.color.s = 70;
                    pt.color.l = 55;
                } else if (pt.color && typeof pt.color.h !== 'undefined' && pt._baseH !== undefined) {
                    // 恢复原始颜色（从闪电或 RGB 恢复）
                    pt.color.h = pt._baseH;
                    pt.color.s = pt._baseS;
                    pt.color.l = pt._baseL;
                }
                pt.radius = (style === 'thunder') ? Math.max(0.3, pt._baseR) : Math.max(0.3, Math.min(pt._baseR * 5, pt._baseR * sizeMul));
                if (typeof pt.opacity === 'number') {
                    pt.opacity = Math.min(1, pt._baseO * (0.6 + energy * 3));
                }
            }
        }

        // 雷法: 连线颜色也闪
        if (style === 'thunder' && thunderFlashDuration > 0) {
            var elapsed2 = now - (thunderFlashTimer - 250);
            var fp = Math.max(0, 1 - elapsed2 / 250);
            var w2 = Math.round(255 * fp);
            p.particles.line_linked.color = '#' +
                Math.min(255, 58 + w2).toString(16).padStart(2, '0') +
                Math.min(255, 58 + w2).toString(16).padStart(2, '0') +
                Math.min(255, 142 + w2).toString(16).padStart(2, '0');
        } else if (style === 'thunder') {
            p.particles.line_linked.color = '#3a3a8e';
        }
    } catch(e) { console.warn('[音频] 调制失败:', e); }
}
function startAudioMod() { ensureAudioListener(); if (!audioModTimer) audioModTimer = setInterval(audioModStep, 80); }
function stopAudioMod() { if (audioModTimer) { clearInterval(audioModTimer); audioModTimer = null; } }
// 音频调制不再无条件启动——由 applyCustomBackground 按 bgtype 控制
</script>
