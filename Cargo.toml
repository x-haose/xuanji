[package]
name = "xuanji"
version = "0.1.1"
edition = "2024"
license = "MIT"

[dependencies]
cpal = "0.18.1"
directories = "6.0.0"
rfd = "0.17.2"
rust-embed = { version = "8.7.2", features = ["include-exclude"] }
rustfft = "6.4.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tao = "0.35"
thiserror = "2.0.18"
tray-icon = "0.24.1"
wry = { version = "0.55", features = ["transparent"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSWindow",
    "NSResponder",
    "NSColor",
    "NSScreen",
    "NSEvent",
    "NSView",
    "NSVisualEffectView",
    "block2",
] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSDictionary"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_System_Registry",
    "Win32_Security",
] }

[build-dependencies]
winresource = "0.1.31"
